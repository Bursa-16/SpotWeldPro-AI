# SpotWeldPro AI — Render Blueprint (DEMO_RENDER_02)
# https://render.com/docs/blueprint-spec
#
# Three services:
#   1. spotweldpro-ai-api   — FastAPI backend  (Docker runtime)
#   2. spotweldpro-ai-demo  — React SPA        (Static Site)
#   3. spotweldpro-ai-db    — PostgreSQL 16    (Database)
#
# One-time post-deploy setup (chicken-and-egg URLs):
#   After first deploy the two public URLs are known:
#     API:      https://spotweldpro-ai-api.onrender.com
#     Frontend: https://spotweldpro-ai-demo.onrender.com
#   Set the following env vars manually in the Render dashboard and trigger
#   a new deploy for each affected service:
#     Backend  → CORS_ORIGINS = https://spotweldpro-ai-demo.onrender.com
#     Frontend → VITE_API_URL = https://spotweldpro-ai-api.onrender.com/api/v1
#     Frontend → VITE_DEMO_APP_URL = https://spotweldpro-ai-demo.onrender.com/login
#
# Free tier notes:
#   • Web services spin down after 15 min inactivity (cold-start ~30s).
#   • PostgreSQL free instance expires after 90 days; upgrade to paid ($7/mo) before then.
#   • Demo user is seeded by backend/scripts/start.sh when DEMO_PASSWORD is set.

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  - type: web
    name: spotweldpro-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spotweldpro-ai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HOSTED_DEMO
        value: "true"
      - key: DISABLE_DOCS
        value: "true"
      - key: ACCESS_TOKEN_MINUTES
        value: "120"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # Set CORS_ORIGINS once the frontend URL is known (post first deploy).
      # Example: https://spotweldpro-ai-demo.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Admin account — set all three before first deploy; idempotent after that.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # Demo READ_ONLY account — provisioned by scripts/start.sh at each deploy.
      # demo/A1234 are PUBLIC DEMO CREDENTIALS (no security boundary).
      # Password is stored as a PBKDF2-SHA256 hash in the database.
      # OPERATOR: set DEMO_PASSWORD=A1234 in the Render dashboard before first deploy.
      - key: DEMO_USERNAME
        value: "demo"
      - key: DEMO_PASSWORD
        sync: false

  # ── React Frontend (Static Site) ────────────────────────────────────────────
  - type: web
    name: spotweldpro-ai-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # VITE_API_URL must be the backend's public HTTPS URL.
      # Set this once after the backend service is deployed, then redeploy frontend.
      # Example: https://spotweldpro-ai-api.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
      # VITE_DEMO_APP_URL is shown as a "Log In to Demo" link on the Demo page.
      # Set to the frontend login URL once deployed.
      # Example: https://spotweldpro-ai-demo.onrender.com/login
      - key: VITE_DEMO_APP_URL
        sync: false
      # VITE_DEMO_MODE=true enables one-click demo login:
      # username and password are pre-filled with public demo credentials.
      - key: VITE_DEMO_MODE
        value: "true"

databases:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  - name: spotweldpro-ai-db
    plan: free
    databaseName: spotweld
    user: spotweld
