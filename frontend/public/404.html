<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpotWeldPro AI</title>
    <!--
      SPA 404 fallback for GitHub Pages / BrowserRouter deep links.
      GitHub Pages serves this file for any path that has no matching file.
      This script re-encodes the path as a query string and redirects to the
      index, where index.marketing.html restores the original path.

      segmentCount = 1 because the app lives at /SpotWeldPro-Web/ (one segment).
      Based on: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
