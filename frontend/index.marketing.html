<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotWeldPro AI — Spot Welding Engineering Intelligence</title>
    <meta name="description" content="Official SpotWeldPro AI website | AI-assisted resistance spot welding engineering, quality analysis and process optimization." />
    <!--
      SPA deep-link restore for GitHub Pages / BrowserRouter.
      When 404.html redirects a deep link as ?/path, this script restores the
      original path in history before React Router mounts, so /features etc. work
      on direct access and browser refresh.
      Based on: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
          window.history.replaceState(
            null,
            null,
            decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          )
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.marketing.tsx"></script>
  </body>
</html>
